services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    ports:
      - "${ABS_PORT}:80"
    volumes:
      - /mnt/media/audiobooks:/audiobooks
      - ./config:/config
      - ./metadata:/metadata
    environment:
      - TZ=${TZ}
    restart: unless-stopped
